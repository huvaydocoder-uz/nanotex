    <script>
      // 08:00–20:00 kunduzgi rejim, 20:00–08:00 tungi rejim.
      // Qo'lda tanlangan rejim keyingi 08:00 yoki 20:00 gacha amal qiladi.
      var h = new Date().getHours();
      var theme = h >= 8 && h < 20 ? 'light' : 'dark';
      try {
        var manual = JSON.parse(localStorage.getItem('nanotex:theme') || 'null');
        if (manual && Date.now() < manual.until) theme = manual.theme;
      } catch (e) {}
      if (theme === 'light') {
        document.documentElement.classList.add('light');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f6f5f1');
      }
    </script>
